name: Pages

# GitHub Pages: the documentation site (site/) at https://wayne930242.github.io/anchorloop/.
# Rebuilt from every push to master that touches the docs, the site, the skills, the extensions, or the README.
on:
  push:
    branches: [master]
    paths: ["docs/**", "site/**", "skills/**", "pi/**", "README.md", "README.zh-TW.md", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The site's check reads the history of docs/how-it-works.md to report a stale translation.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
        working-directory: site
      - name: Check the zh-TW twins
        run: npm run check
        working-directory: site
      - name: Build the documentation site
        run: npm run build
        working-directory: site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
